<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantaForma | Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #f2f3f2; /* 洗練された明るいライトグレー */
            --card-bg: #ffffff; /* 高級感のある純白のカード */
            --accent-color: #2c3e2c; /* 深みのあるディープボタニカルグリーン */
            --hover-border: #8c9c8c; /* ホバー時の柔らかな線の色 */
            --text-main: #1a1a1a; /* 締まりのある上品な黒 */
            --text-sub: #666666; /* 読みやすい中間グレー */
            --header-spacing: 80px; /* プロ仕様のゆったりとした上部余白 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--header-spacing) 20px 100px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            /* 明るい背景に美しく馴染む極薄のグリッドライン */
            background-image: 
                linear-gradient(rgba(44, 62, 44, 0.012) 1px, transparent 1px),
                linear-gradient(90deg, rgba(44, 62, 44, 0.012) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* --- ヘッダー・ロゴエリア --- */
        .profile {
            text-align: center;
            margin-bottom: 80px;
            width: 100%;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            width: 100%;
            max-width: 220px;
            height: auto;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.04));
            /* 中央からヘッダー位置へ移動するアニメーション */
            animation: logoEntryPoint 1.2s cubic-bezier(0.8, 0, 0.2, 1) forwards;
        }

        @keyframes logoEntryPoint {
            0% {
                transform: translateY(30vh) scale(1.3);
                opacity: 0;
                filter: blur(15px);
            }
            35% {
                opacity: 1;
                filter: blur(0px);
            }
            70% {
                transform: translateY(30vh) scale(1.3);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        .tagline {
            font-size: 10px;
            color: var(--text-sub);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 25px;
            opacity: 0;
            animation: fadeIn 0.6s ease 1.3s forwards;
        }

        /* --- リンクカードエリア --- */
        .link-container {
            width: 100%;
            max-width: 380px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 2px; /* ミニマルさを際立たせるシャープな角 */
            padding: 22px 26px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
            transform: translateY(20px);
            animation: cardReveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.015);
        }

        /* タイポを修正し、4つのカードが綺麗に時間差で出るように設定 */
        .link-card:nth-child(1) { animation-delay: 1.5s; }
        .link-card:nth-child(2) { animation-delay: 1.6s; }
        .link-card:nth-child(3) { animation-delay: 1.7s; }
        .link-card:nth-child(4) { animation-delay: 1.8s; }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* ホバー時の洗練された浮遊感 */
        .link-card:hover {
            border-color: var(--hover-border);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.05);
        }

        .link-card i {
            font-size: 18px;
            margin-right: 24px;
            color: #888888;
            width: 20px;
            text-align: center;
            transition: 0.4s;
        }

        .link-card:hover i {
            color: var(--accent-color);
        }

        .link-text span {
            display: block;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .link-text small {
            display: block;
            font-size: 9px;
            color: var(--text-sub);
            margin-top: 4px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .arrow {
            font-size: 10px;
            color: #dddddd;
            margin-left: auto;
            transition: 0.4s;
        }

        .link-card:hover .arrow {
            color: var(--accent-color);
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <div class="profile">
        <img src="PlantaForma_logo.jpg" alt="PlantaForma Logo" class="logo">
        <p class="tagline">3D Design & Botanical Lab</p>
    </div>

    <div class="link-container">
        <!-- 1. BOOTH (最上部に配置) -->
        <a href="https://plantaforma.booth.pm/" class="link-card" target="_blank">
            <i class="fa-solid fa-shop"></i>
            <div class="link-text">
                <span>BOOTH Shop</span>
                <small>Original Products & Data</small>
            </div>
            <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </a>

        <!-- 2. X (Twitter) -->
        <a href="https://x.com/Afk_Ty" class="link-card" target="_blank">
            <i class="fa-brands fa-x-twitter"></i>
            <div class="link-text">
                <span>X (Twitter)</span>
                <small>Latest Updates</small>
            </div>
            <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </a>

        <!-- 3. YouTube -->
        <a href="https://youtube.com/@snob_PF" class="link-card" target="_blank">
            <i class="fa-brands fa-youtube"></i>
            <div class="link-text">
                <span>YouTube</span>
                <small>Vlogs & Reviews</small>
            </div>
            <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </a>

        <!-- 4. MakerWorld -->
        <a href="https://makerworld.com/ja/@PlantaForma" class="link-card" target="_blank">
            <i class="fa-solid fa-cube"></i>
            <div class="link-text">
                <span>MakerWorld</span>
                <small>3D Data Store</small>
            </div>
            <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
        </a>
    </div>

</body>
</html>
